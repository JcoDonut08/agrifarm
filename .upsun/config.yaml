# Uploads use stable storage paths; keep these names unchanged after launch.
applications:
  agrifarm:
    source:
      root: /
    type: composable:26.05
    stack:
      runtimes:
        - php@8.4:
            extensions: [bcmath, curl, fileinfo, gd, intl, mbstring, opcache, pdo_pgsql, sodium, zip]
            request_terminate_timeout: 240
        - nodejs@24
        - python@3.13
      packages:
        - php84Packages.composer
        # Scientific Python wheels need the C++ runtime supplied by this package.
        - gcc
    relationships:
      database:
        service: database
        endpoint: postgresql
    mounts:
      bootstrap/cache:
        source: storage
        source_path: bootstrap-cache
      storage/app/private:
        source: storage
        source_path: private-uploads
      storage/app/public:
        source: storage
        source_path: public-uploads
      storage/framework:
        source: storage
        source_path: framework
      storage/logs:
        source: storage
        source_path: logs
    variables:
      env:
        APP_NAME: AgriFarm
        APP_ENV: production
        APP_DEBUG: 'false'
        LOG_CHANNEL: stderr
        LOG_LEVEL: warning
        DB_CONNECTION: pgsql
        DB_TIMEZONE: '+00:00'
        SESSION_DRIVER: file
        SESSION_SECURE_COOKIE: 'true'
        SESSION_SAME_SITE: lax
        CACHE_STORE: file
        FILESYSTEM_DISK: local
        QUEUE_CONNECTION: database
        SCOUT_DRIVER: 'null'
        OPEN_METEO_ENABLED: 'true'
        GOOGLE_WEATHER_ENABLED: 'false'
        FORECAST_PYTHON_BIN: /app/python/.venv/bin/python
        FORECAST_TIMEOUT: '180'
        FORECAST_TUNING_SECONDS: '30'
        OPENBLAS_NUM_THREADS: '1'
        OMP_NUM_THREADS: '1'
      php:
        memory_limit: 256M
        upload_max_filesize: 10M
        post_max_size: 12M
        max_execution_time: 240
    hooks:
      build: |
        set -eu
        bash .upsun/build.sh
      deploy: |
        set -eu
        bash .upsun/deploy.sh
    web:
      upstream:
        socket_family: unix
        protocol: fastcgi
      locations:
        /:
          root: public
          passthru: /index.php
          index: [index.php]
          scripts: true
          allow: true
          expires: -1
          rules:
            '\.(?:php|env|ya?ml|ini|log|sql)$':
              allow: false
            '^/index\.php$':
              allow: true
        /build:
          root: public/build
          scripts: false
          allow: true
          passthru: false
          expires: 31536000
        /storage:
          root: storage/app/public
          scripts: false
          allow: false
          passthru: false
          rules:
            '\.(?:jpe?g|png|webp|gif)$':
              allow: true
    workers:
      order-emails:
        commands:
          start: php artisan queue:work database --queue=order-emails --sleep=1 --tries=3 --timeout=60

services:
  database:
    type: postgresql:18

routes:
  'https://{default}/':
    type: upstream
    upstream: agrifarm:http
    primary: true
  'http://{default}/':
    type: redirect
    to: 'https://{default}/'
